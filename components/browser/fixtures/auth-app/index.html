<!doctype html><html><head><meta charset="utf-8"><title>Authenticated Dashboard Fixture</title><style>body{font:16px system-ui;max-width:900px;margin:3rem auto}label{display:block;margin:.7rem 0}input,button{font:inherit;padding:.5rem}</style></head><body><main><h1>Local authenticated dashboard</h1><form id="login"><label>Username <input name="username" value="pi" autocomplete="username"></label><label>Password <input name="password" type="password" value="browser" autocomplete="current-password"></label><button>Sign in</button></form><section id="dashboard" hidden><h2>Network overview</h2><p id="summary"></p><button id="logout">Sign out</button></section><p role="status" id="status"></p></main><script>
const status=document.querySelector('#status'),form=document.querySelector('#login'),dashboard=document.querySelector('#dashboard');async function load(){const r=await fetch('/api/clients');if(r.ok){const d=await r.json();form.hidden=true;dashboard.hidden=false;document.querySelector('#summary').textContent=`${d.connected} connected clients · ${d.accessPoints} access points · Gateway health: ${d.gatewayHealth}`;}}form.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(form));const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(v)});status.textContent=r.ok?'Signed in':'Invalid credentials';if(r.ok)load();};document.querySelector('#logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.reload();};load();
</script></body></html>
