<!doctype html><html><head><meta charset="utf-8"><title>Canvas Fixture</title><style>body{font:16px system-ui;margin:2rem}canvas{border:1px solid}</style></head><body><h1>Canvas topology</h1><canvas id="map" width="800" height="420" aria-label="Network topology canvas"></canvas><button id="redraw">Redraw topology</button><output id="status"></output><script>
const canvas=document.querySelector('#map'),ctx=canvas.getContext('2d');function draw(){ctx.clearRect(0,0,800,420);ctx.font='20px sans-serif';ctx.strokeRect(70,160,150,80);ctx.fillText('Gateway',100,205);ctx.strokeRect(570,70,150,80);ctx.fillText('Access Point',590,115);ctx.strokeRect(570,270,150,80);ctx.fillText('Client',620,315);ctx.beginPath();ctx.moveTo(220,200);ctx.lineTo(570,110);ctx.moveTo(220,200);ctx.lineTo(570,310);ctx.stroke();document.querySelector('#status').textContent='Topology rendered';}draw();document.querySelector('#redraw').onclick=draw;
</script></body></html>
