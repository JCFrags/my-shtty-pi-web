<!doctype html><html><head><meta charset="utf-8"><title>SPA Fixture</title><style>body{font:16px system-ui;max-width:900px;margin:3rem auto}button,input{font:inherit;padding:.5rem;margin:.3rem}</style></head><body><div id="root" aria-busy="true">Loading application…</div><script>
setTimeout(()=>{document.title='Rendered Client Dashboard';document.querySelector('#root').innerHTML=`<main><h1>Client dashboard</h1><p id="count">48 connected clients</p><label>Search clients <input aria-label="Search clients"></label><button id="add">Add client</button><ul id="clients"><li>Desktop-PC</li><li>Laptop</li></ul><div id="toast" role="status"></div></main>`;document.querySelector('#root').setAttribute('aria-busy','false');document.querySelector('#add').onclick=()=>{document.querySelector('#toast').textContent='Client creation dialog opened';document.querySelector('#count').textContent='49 connected clients';};},250);
</script></body></html>
