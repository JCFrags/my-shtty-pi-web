<!doctype html><html><head><meta charset="utf-8"><title>Uploads and Downloads Fixture</title></head><body><main><h1>Artifact transfer fixture</h1><label>Upload a file <input id="file" type="file"></label><button id="upload">Upload</button><a id="download" href="/api/download" download>Download fixture</a><pre id="result"></pre></main><script>
document.querySelector('#upload').onclick=async()=>{const file=document.querySelector('#file').files[0];if(!file)return;const r=await fetch('/api/upload',{method:'POST',body:file});document.querySelector('#result').textContent=JSON.stringify(await r.json(),null,2);};
</script></body></html>
