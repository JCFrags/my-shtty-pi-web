[project]
name = "pi-web-docling"
version = "0.1.0"
description = "Local document conversion worker for Pi Web Workspace"
requires-python = ">=3.13"
dependencies = [
  "docling==2.115.0",
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
]

[project.scripts]
pi-web-docling = "pi_web_docling.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_web_docling"]
