[project]
name = "pi-web-reader"
version = "0.1.0"
description = "Capability-first local main-content reader for Pi Web Workspace"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.116.1",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "trafilatura==2.1.0",
  "uvicorn[standard]==0.35.0",
]

[project.scripts]
pi-web-reader = "pi_web_reader.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_web_reader"]
