[project]
name = "pi-web-crawl"
version = "0.1.0"
description = "Bounded Crawl4AI service for Pi Web Tools"
requires-python = ">=3.13"
dependencies = [
  "crawl4ai==0.9.2",
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
]

[project.scripts]
pi-web-crawl = "pi_web_crawl.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_web_crawl"]
