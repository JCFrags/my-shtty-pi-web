[tool.uv.workspace]
members = ["services/reader", "services/docling", "services/crawl"]

[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.4.0"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests/reader", "tests/docling"]
