[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/backend-core",
  "crates/backend-agent-browser",
  "crates/backend-pinchtab",
  "crates/artifact-store",
  "crates/reader-client",
  "crates/browserd",
  "apps/workspace/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.98"
async-trait = "0.1.88"
axum = { version = "0.8.4", features = ["http1", "json", "tokio", "ws"] }
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.41", features = ["serde"] }
dashmap = "6.1.0"
futures = "0.3.31"
http = "1.3.1"
regex = "1.11.1"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.36.0", features = ["bundled", "chrono"] }
schemars = { version = "1.0.4", features = ["chrono04", "uuid1", "url2"] }
semver = "1.0.26"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.46.1", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["net", "sync"] }
toml = "0.9.2"
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
ulid = { version = "1.2.1", features = ["serde"] }
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.17.0", features = ["serde", "v4", "v5"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
