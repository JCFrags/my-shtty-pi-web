[project]
name = "webx-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema-gentypes==2.12.0",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.2",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["scripts/toolchain*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts/toolchain*.py"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["toolchain*_test.py"]
addopts = "--strict-config --strict-markers"
