        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: createCrawl contract example
  /crawls/{crawl_id}:
    get:
      tags:
      - crawls
      operationId: getCrawl
      parameters:
      - $ref: '#/components/parameters/CrawlId'
      responses:
        '200':
          description: Crawl
          content:
            application/json:
