      x-webx-scopes:
      - crawls.read
      x-webx-request-limits:
        max_body_bytes: 0
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: getCrawl contract example
  /extractions:
    post:
      tags:
      - retrieval
      operationId: createExtraction
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractionRequest'
      responses:
        '200':
          $ref: '#/components/responses/ArtifactResult'
        '202':
          $ref: '#/components/responses/JobAccepted'
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - retrieval.write
