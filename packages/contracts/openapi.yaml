  /wiki/consumers/{consumer_id}/deliveries/{delivery_id}/envelope:
    get:
      tags:
      - wiki
      operationId: getWikiDeliveryEnvelope
      parameters:
      - $ref: '#/components/parameters/ConsumerId'
      - $ref: '#/components/parameters/DeliveryId'
      responses:
        '200':
