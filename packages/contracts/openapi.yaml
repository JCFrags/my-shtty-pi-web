      operationId: createIndexRebuild
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - targets
              properties:
                targets:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                    - pages
                    - chunks
                    - history
                    - all
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - index.write
      x-webx-request-limits:
        max_body_bytes: 1048576
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: createIndexRebuild contract example
