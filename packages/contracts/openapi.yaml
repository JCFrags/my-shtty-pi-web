components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-webx-key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    EngineId:
      name: engine_id
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    CrawlId:
      name: crawl_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    PageId:
      name: page_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    VisitId:
      name: visit_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    ConsumerId:
      name: consumer_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
    DeliveryId:
      name: delivery_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    ArchiveId:
      name: archive_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    WatchId:
      name: watch_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    BackupId:
      name: backup_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    PartNumber:
      name: part_number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 10000
  responses:
    Problem:
      description: Structured error
      content:
        application/problem+json:
          schema:
            $ref: ./schemas/error.json
    JobAccepted:
      description: Job accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JobAccepted'
    ArtifactResult:
      description: Completed result
      content:
        application/json:
          schema:
            $ref: ./schemas/artifact-result.json
  schemas:
    Ulid:
      type: string
      pattern: ^[0-9a-hjkmnp-tv-z]{26}$
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      - checked_at
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - unavailable
        checked_at:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties: true
    Version:
      type: object
      required:
      - api_version
      - webx_version
      - schema_version
      properties:
        api_version:
          type: string
        webx_version:
          type: string
        schema_version:
          type: string
        components:
          type: object
          additionalProperties:
            type: string
    Capability:
      type: object
      required:
      - id
      - enabled
      - healthy
      - permission
      properties:
        id:
          type: string
        enabled:
          type: boolean
        healthy:
          type: boolean
        permission:
          type: string
        stability:
          type: string
          enum:
          - stable
          - beta
          - experimental
        limits:
          type: object
          additionalProperties: true
    Engine:
      type: object
      required:
      - id
      - kind
      - enabled
      - health
      properties:
        id:
          type: string
        kind:
          type: string
        version:
          type: string
        enabled:
          type: boolean
        health:
          type: string
          enum:
          - healthy
          - degraded
          - unhealthy
          - unknown
        capabilities:
          type: array
          items:
            type: string
        last_probe_at:
          type: string
          format: date-time
        diagnostics:
          type: object
          additionalProperties: true
    JobAccepted:
      type: object
      additionalProperties: false
      required:
      - job_id
      - state
      - operation
      - status_url
      - events_url
      - result_url
      properties:
        job_id:
          $ref: '#/components/schemas/Ulid'
        state:
          const: queued
        operation:
          type: string
        status_url:
          type: string
        events_url:
          type: string
        result_url:
          type: string
    FetchRequest:
      type: object
      additionalProperties: false
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          maxLength: 8192
        mode:
          type: string
          enum:
          - auto
          - http
          - browser
          - adaptive
          - rag
          - archive
          - offline
          default: auto
        engine:
          type: string
        collection:
          type: string
          default: default
        visibility:
          type: string
          enum:
          - public
          - internal
          - private
          - secret
          default: internal
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
        selector:
          type: string
          maxLength: 2000
        archive:
          type: boolean
          default: false
        screenshot:
          type: string
          enum:
          - none
          - viewport
          - full
          default: none
        max_bytes:
          type: integer
          minimum: 1
        deadline_seconds:
          type: integer
          minimum: 1
        credential_ref:
          type: string
        wait_index:
          type: boolean
          default: false
        wait_wiki:
          type: boolean
          default: false
    VerifyRequest:
      allOf:
      - $ref: '#/components/schemas/FetchRequest'
      - type: object
        properties:
          critical_fields:
            type: array
            items:
              type: string
          minimum_independent_observations:
            type: integer
            minimum: 2
            default: 2
    BrowserSessionRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 80
        persistent:
          type: boolean
          default: false
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 86400
        visibility:
          type: string
          enum:
          - public
          - internal
          - private
          - secret
    BrowserSession:
      type: object
      required:
      - session_id
      - state
      - created_at
      - expires_at
      properties:
        session_id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        state:
          type: string
          enum:
          - starting
          - ready
          - busy
          - closed
          - failed
        current_url:
          type: string
          format: uri
        document_generation:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    BrowserAction:
      type: object
      required:
      - action
      discriminator:
        propertyName: action
      properties:
        action:
          type: string
          enum:
          - navigate
          - snapshot
          - click
          - type
          - select
          - upload
          - screenshot
          - pdf
          - console
          - network
          - trace_start
          - trace_stop
        url:
          type: string
          format: uri
        ref:
          type: string
        document_generation:
          type: string
        text:
          type: string
        value:
          type: string
        upload_artifact_id:
          $ref: '#/components/schemas/Ulid'
        full:
          type: boolean
    CrawlRequest:
      type: object
      additionalProperties: false
      required:
      - seed_url
      - max_pages
      - max_depth
      - deadline_seconds
      properties:
        seed_url:
          type: string
          format: uri
        engine:
          type: string
          default: crawlee
        mode:
          type: string
          enum:
          - auto
          - http
          - browser
          - adaptive
          - rag
          - archive
        scope:
          type: string
          enum:
          - same-origin
          - same-site
          - allowlist
        allowed_origins:
          type: array
          items:
            type: string
            format: uri
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            type: string
        max_pages:
          type: integer
          minimum: 1
          maximum: 1000000
        max_depth:
          type: integer
          minimum: 0
          maximum: 100
        max_bytes:
          type: integer
          minimum: 1
        deadline_seconds:
          type: integer
          minimum: 1
        concurrency:
          type: integer
          minimum: 1
        respect_robots:
          type: boolean
          default: true
        collection:
          type: string
        visibility:
          type: string
          enum:
          - public
          - internal
          - private
          - secret
    Crawl:
      type: object
      required:
      - crawl_id
      - job_id
      - state
      - seed_url
      - budgets
      - counters
      properties:
        crawl_id:
          $ref: '#/components/schemas/Ulid'
        job_id:
          $ref: '#/components/schemas/Ulid'
        state:
          type: string
        seed_url:
          type: string
          format: uri
        budgets:
          type: object
          additionalProperties: true
        counters:
          type: object
          additionalProperties:
            type: integer
        checkpoint_at:
          type: string
          format: date-time
    ExtractionRequest:
      type: object
      additionalProperties: false
      required:
      - input
      - kind
      properties:
        input:
          $ref: '#/components/schemas/InputRef'
        kind:
          type: string
          enum:
          - main_content
          - metadata
          - links
          - table
          - schema
        selector:
          type: string
        schema_artifact_id:
          $ref: '#/components/schemas/Ulid'
        allow_local_ai:
          type: boolean
          default: false
        model_profile:
          type: string
    InputRef:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        url:
          type: string
          format: uri
        artifact_id:
          $ref: '#/components/schemas/Ulid'
        upload_id:
          $ref: '#/components/schemas/Ulid'
    FileOperationRequest:
      type: object
      additionalProperties: false
      required:
      - input
      properties:
        input:
          $ref: '#/components/schemas/InputRef'
        output_format:
          type: string
        language:
          type: array
          items:
            type: string
        options:
          type: object
