        max_body_bytes: 1048576
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: createExtraction contract example
  /jobs:
    get:
      tags:
      - jobs
      operationId: listJobs
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
