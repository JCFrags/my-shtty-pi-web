      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: ./schemas/job.json
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - jobs.read
      x-webx-request-limits:
        max_body_bytes: 0
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: getJob contract example
  /jobs/{job_id}/result:
    get:
      tags:
      - jobs
      operationId: getJobResult
      parameters:
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          $ref: '#/components/responses/ArtifactResult'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - jobs.read
      x-webx-request-limits:
        max_body_bytes: 0
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: getJobResult contract example
  /jobs/{job_id}/cancel:
    post:
      tags:
      - jobs
      operationId: cancelJob
      parameters:
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: ./schemas/job.json
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - jobs.write
      x-webx-request-limits:
        max_body_bytes: 1048576
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: cancelJob contract example
  /jobs/{job_id}/events:
    get:
      tags:
      - jobs
      operationId: streamJobEvents
      parameters:
      - $ref: '#/components/parameters/JobId'
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - jobs.read
      x-webx-request-limits:
        max_body_bytes: 0
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: streamJobEvents contract example
  /artifacts/{artifact_id}/metadata:
    get:
      tags:
      - artifacts
      operationId: getArtifactMetadata
      parameters:
      - $ref: '#/components/parameters/ArtifactId'
      responses:
        '200':
          description: Metadata
          content:
            application/json:
              schema:
