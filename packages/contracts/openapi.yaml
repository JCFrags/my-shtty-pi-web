              properties:
                url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Feed candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - monitoring.write
      x-webx-request-limits:
        max_body_bytes: 1048576
