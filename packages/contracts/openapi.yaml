      operationId: acknowledgeWikiDelivery
      parameters:
      - $ref: '#/components/parameters/ConsumerId'
      - $ref: '#/components/parameters/DeliveryId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
