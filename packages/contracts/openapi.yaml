        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - artifacts.read
      x-webx-request-limits:
        max_body_bytes: 0
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: getArtifactMetadata contract example
  /artifacts/{artifact_id}/content:
    get:
      tags:
      - artifacts
      operationId: getArtifactContent
      parameters:
      - $ref: '#/components/parameters/ArtifactId'
      responses:
        '200':
          description: Artifact bytes
          content:
            application/octet-stream:
              schema:
                type: string
                contentEncoding: binary
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - artifacts.read
      x-webx-request-limits:
        max_body_bytes: 0
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: getArtifactContent contract example
  /artifacts/{artifact_id}/excerpt:
    get:
      tags:
      - artifacts
      operationId: getArtifactExcerpt
      parameters:
      - $ref: '#/components/parameters/ArtifactId'
      - name: start_line
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: max_lines
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        '200':
          description: Excerpt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactExcerpt'
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - artifacts.read
      x-webx-request-limits:
        max_body_bytes: 0
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
