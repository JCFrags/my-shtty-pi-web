openapi: 3.1.0
info:
  title: WebX Local Web Workbench API
  version: 1.0.0
  description: Canonical API for the WebX CLI, Pi extension, workers, and wiki intake.
  x-webx-api-major: 1
servers:
- url: http://localhost/v1
  description: HTTP semantics over the configured Unix socket or loopback listener
security:
- bearerAuth: []
tags:
- name: system
- name: search
- name: retrieval
- name: browser
- name: crawls
- name: jobs
- name: artifacts
- name: pages
- name: documents
- name: media
- name: archives
- name: monitoring
- name: index
- name: wiki
- name: corpus
- name: admin
paths:
  /health/live:
    get:
      tags:
      - system
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Process is live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - system.read
      x-webx-request-limits:
        max_body_bytes: 0
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: getLiveness contract example
  /health/ready:
    get:
      tags:
      - system
      operationId: getReadiness
      responses:
        '200':
          description: Core is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - system.read
      x-webx-request-limits:
        max_body_bytes: 0
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: getReadiness contract example
  /version:
    get:
      tags:
      - system
      operationId: getVersion
      responses:
        '200':
          description: Version metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - system.read
      x-webx-request-limits:
        max_body_bytes: 0
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: getVersion contract example
  /capabilities:
    get:
      tags:
      - system
      operationId: getCapabilities
      responses:
        '200':
          description: Enabled capability catalog
          content:
            application/json:
              schema:
                type: object
                required:
                - api_version
                - capabilities
                properties:
                  api_version:
                    type: string
                  capabilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Capability'
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - system.read
      x-webx-request-limits:
        max_body_bytes: 0
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: getCapabilities contract example
  /engines:
    get:
      tags:
      - system
      operationId: listEngines
      responses:
        '200':
          description: Engines
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Engine'
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - system.read
      x-webx-request-limits:
        max_body_bytes: 0
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: listEngines contract example
  /engines/{engine_id}/probe:
    post:
      tags:
      - system
      operationId: probeEngine
      parameters:
      - $ref: '#/components/parameters/EngineId'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - system.write
      x-webx-request-limits:
        max_body_bytes: 1048576
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: probeEngine contract example
  /search:
    post:
      tags:
      - search
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Search response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - search.write
      x-webx-request-limits:
        max_body_bytes: 1048576
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: search contract example
  /search/local:
    post:
      tags:
      - search
      operationId: searchLocal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Local search response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - search.write
      x-webx-request-limits:
        max_body_bytes: 1048576
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: searchLocal contract example
  /fetch:
    post:
      tags:
      - retrieval
      operationId: createFetch
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchRequest'
      responses:
        '200':
          $ref: '#/components/responses/ArtifactResult'
        '202':
          $ref: '#/components/responses/JobAccepted'
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - retrieval.write
      x-webx-request-limits:
        max_body_bytes: 1048576
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: createFetch contract example
  /verify:
    post:
      tags:
      - retrieval
      operationId: createVerification
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          $ref: '#/components/responses/ArtifactResult'
        '202':
          $ref: '#/components/responses/JobAccepted'
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - retrieval.write
      x-webx-request-limits:
        max_body_bytes: 1048576
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: createVerification contract example
  /browser/sessions:
    post:
      tags:
      - browser
      operationId: createBrowserSession
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserSessionRequest'
      responses:
        '201':
          description: Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSession'
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - browser.write
      x-webx-request-limits:
        max_body_bytes: 1048576
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: createBrowserSession contract example
  /browser/sessions/{session_id}:
    get:
      tags:
      - browser
      operationId: getBrowserSession
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSession'
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - browser.read
      x-webx-request-limits:
        max_body_bytes: 0
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: getBrowserSession contract example
    delete:
      tags:
      - browser
      operationId: closeBrowserSession
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Closed
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - browser.write
      x-webx-request-limits:
        max_body_bytes: 1048576
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: closeBrowserSession contract example
  /browser/sessions/{session_id}/actions:
    post:
      tags:
      - browser
      operationId: createBrowserAction
      parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserAction'
      responses:
        '200':
          $ref: '#/components/responses/ArtifactResult'
        '202':
          $ref: '#/components/responses/JobAccepted'
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - browser.write
      x-webx-request-limits:
        max_body_bytes: 1048576
        max_response_bytes: 5242880
      x-webx-examples:
      - name: contract-smoke
        summary: createBrowserAction contract example
  /crawls:
    post:
      tags:
      - crawls
      operationId: createCrawl
      parameters:
