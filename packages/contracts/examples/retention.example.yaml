schema_version: 1

defaults:
  visit_markdown:
    retain_days: 0
    action: retain
  page_markdown:
    retain_days: 0
    action: retain
  page_metadata_json:
    retain_days: 0
    action: retain
  raw_html:
    retain_days: 180
    action: delete_if_unreferenced
  raw_http_headers:
    retain_days: 180
    action: redact_then_delete_if_unreferenced
  screenshot:
    retain_days: 90
    action: delete_if_unreferenced
  browser_trace:
    retain_days: 30
    action: delete_if_unreferenced
  failed_response_body:
    retain_days: 7
    action: delete_if_unreferenced
  media_metadata:
    retain_days: 0
    action: retain
  acquired_media:
    retain_days: 0
    action: collection_policy
  transcript:
    retain_days: 0
    action: retain
  document_source:
    retain_days: 0
    action: collection_policy
  derived_ai_output:
    retain_days: 365
    action: delete_if_unreferenced
  job_logs:
    retain_days: 30
    action: delete
  audit_log:
    retain_days: 365
    action: delete_unless_legal_hold
  search_projection:
    retain_days: 0
    action: rebuildable
  model_prompt_diagnostics:
    retain_days: 0
    action: do_not_store_by_default

collection_overrides:
  default: {}
  temporary-research:
    raw_html: {retain_days: 30, action: delete_if_unreferenced}
    screenshot: {retain_days: 14, action: delete_if_unreferenced}
  private:
    wiki_delivery: {enabled: false}
    search_projection: {enabled: false}

rules:
  - legal_hold_always_wins
  - source_or_derivative_reference_prevents_blob_deletion
  - markdown_deletion_requires_explicit_tombstone_and_administrator_action
  - projection_deletion_does_not_delete_source
  - credentialed_content_uses_collection_policy
  - expired_browser_profiles_are_securely_removed_best_effort
  - retention_runs_generate_plan_before_apply
  - every_deletion_is_audited
