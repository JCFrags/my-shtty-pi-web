schema_version: 1

# At least one runtime may be enabled, but no local model is required for core WebX.
# Runtimes must be reachable only on a trusted local/container network.
runtimes:
  - id: llama-portable
    kind: llama_cpp
    enabled: false
    base_url: ${LLAMA_CPP_URL:-http://llama-cpp:8081/v1}
    api_key_secret_ref: env:LLAMA_CPP_API_KEY
    health_path: /models
    concurrency: 1
    models:
      generation:
        id: ${LLAMA_CPP_MODEL_ID}
        context_window: 32768
        max_output_tokens: 4096
        capabilities: [chat, json_schema]
      embeddings:
        id: ${LLAMA_CPP_EMBEDDING_MODEL_ID:-}
        dimensions: ${LLAMA_CPP_EMBEDDING_DIMENSIONS:-0}
        capabilities: [embeddings]
    launch_profile:
      managed: false
      command: llama-server
      arguments:
        - --host
        - 0.0.0.0
        - --port
        - "8081"
        - --model
        - ${LLAMA_CPP_MODEL_PATH}
        - --api-key
        - ${LLAMA_CPP_API_KEY}
      model_paths_allowed:
        - ${WEBX_MODEL_DIR:-./.data/models}

  - id: vllm-gpu
    kind: vllm
    enabled: false
    base_url: ${VLLM_URL:-http://vllm:8000/v1}
    api_key_secret_ref: env:VLLM_API_KEY
    health_path: /models
    concurrency: 8
    models:
      generation:
        id: ${VLLM_MODEL_ID}
        context_window: 32768
        max_output_tokens: 4096
        capabilities: [chat, json_schema]
      embeddings:
        id: ${VLLM_EMBEDDING_MODEL_ID:-}
        dimensions: ${VLLM_EMBEDDING_DIMENSIONS:-0}
        capabilities: [embeddings]
      rerank:
        id: ${VLLM_RERANK_MODEL_ID:-}
        capabilities: [rerank]
    launch_profile:
      managed: false
      command: vllm
      arguments:
        - serve
        - ${VLLM_MODEL_ID}
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        - --api-key
        - ${VLLM_API_KEY}

profiles:
  generation_default:
    workload: structured_extract
    runtime_preference: [vllm-gpu, llama-portable]
    temperature: 0
    top_p: 1
    timeout_seconds: 300
    max_retries: 1
    require_json_schema: true
    external_tools: false
    filesystem_access: false
    network_access: false

  embeddings_default:
    workload: embedding
    runtime_preference: [vllm-gpu, llama-portable]
    batch_size: 32
    timeout_seconds: 300
    normalize: true
    external_tools: false
    filesystem_access: false
    network_access: false

  rerank_default:
    workload: rerank
    runtime_preference: [vllm-gpu]
    batch_size: 64
    timeout_seconds: 120
    external_tools: false
    filesystem_access: false
    network_access: false

validation:
  reject_runtime_kinds: [ollama]
  reject_non_loopback_or_internal_urls: true
  reject_unlisted_models: true
  require_model_identity_in_outputs: true
  require_source_hash_in_cache_key: true
