openapi: 3.1.0
info:
  title: WebX Internal Worker API
  version: 1.0.0
  description: Internal pull-based worker, artifact-transfer, and egress-authorization protocol. Never expose outside the
    WebX control network.
  x-webx-protocol-major: 1
servers:
- url: http://webxd:7331/internal/v1
security:
- workerBearer: []
paths:
  /workers/register:
    post:
      operationId: registerWorker
      security:
      - bootstrapBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerRegistration'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerSession'
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - internal.worker
      x-webx-request-limits:
        max_body_bytes: 1048576
        max_response_bytes: 1048576
      x-webx-examples:
      - name: protocol-smoke
        summary: registerWorker contract example
  /workers/{worker_id}/heartbeat:
    post:
      operationId: heartbeatWorker
      parameters:
      - $ref: '#/components/parameters/WorkerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - capacity
              - health
              properties:
                capacity:
                  type: object
                  additionalProperties:
                    type: integer
                    minimum: 0
                health:
                  type: object
                  additionalProperties:
                    type: string
                metrics:
                  type: object
                  additionalProperties: true
              additionalProperties: false
      responses:
        '200':
          description: Session remains valid
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - internal.worker
      x-webx-request-limits:
        max_body_bytes: 1048576
        max_response_bytes: 1048576
      x-webx-examples:
      - name: protocol-smoke
        summary: heartbeatWorker contract example
  /leases/claim:
    post:
      operationId: claimLease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - worker_id
              - capabilities
              - free_capacity
              properties:
                worker_id:
                  $ref: '#/components/schemas/Ulid'
                capabilities:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  uniqueItems: true
                free_capacity:
                  type: object
                  additionalProperties:
                    type: integer
                    minimum: 0
                wait_seconds:
                  type: integer
                  minimum: 0
                  maximum: 30
                  default: 10
              additionalProperties: false
      responses:
        '200':
          description: Lease assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptLease'
        '204':
          description: No matching work; Retry-After may be supplied
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - internal.worker
      x-webx-request-limits:
        max_body_bytes: 1048576
        max_response_bytes: 1048576
      x-webx-examples:
      - name: protocol-smoke
        summary: claimLease contract example
  /attempts/{attempt_id}/heartbeat:
    post:
      operationId: heartbeatAttempt
      parameters:
      - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - lease_token
              - phase
              properties:
                lease_token:
                  type: string
                  minLength: 32
                  maxLength: 512
                phase:
                  type: string
                  maxLength: 128
                progress:
                  type: number
                  minimum: 0
                  maximum: 1
                counters:
                  type: object
                  additionalProperties:
                    type: number
              additionalProperties: false
      responses:
        '200':
          description: Lease state
          content:
            application/json:
              schema:
                type: object
                required:
                - lease_expires_at
                - cancellation_requested
                properties:
                  lease_expires_at:
                    type: string
                    format: date-time
                  cancellation_requested:
                    type: boolean
                  effective_deadline:
                    type: string
                    format: date-time
                additionalProperties: false
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - internal.worker
      x-webx-request-limits:
        max_body_bytes: 1048576
        max_response_bytes: 1048576
      x-webx-examples:
      - name: protocol-smoke
        summary: heartbeatAttempt contract example
  /attempts/{attempt_id}/progress:
    post:
      operationId: reportAttemptProgress
      parameters:
      - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - lease_token
              - event
              properties:
                lease_token:
                  type: string
                event:
                  type: string
                payload:
                  type: object
                  additionalProperties: true
              additionalProperties: false
      responses:
        '202':
          description: Progress recorded
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - internal.worker
      x-webx-request-limits:
        max_body_bytes: 1048576
        max_response_bytes: 1048576
      x-webx-examples:
      - name: protocol-smoke
        summary: reportAttemptProgress contract example
  /attempts/{attempt_id}/inputs/{input_id}:
    get:
      operationId: downloadAttemptInput
      parameters:
      - $ref: '#/components/parameters/AttemptId'
      - $ref: '#/components/parameters/InputId'
      - name: X-WebX-Lease-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Immutable input bytes
          headers:
            Digest:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
          content:
            application/octet-stream:
              schema:
                type: string
                contentEncoding: binary
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - internal.worker
      x-webx-request-limits:
        max_body_bytes: 1048576
        max_response_bytes: 268435456
      x-webx-examples:
      - name: protocol-smoke
        summary: downloadAttemptInput contract example
  /attempts/{attempt_id}/outputs/{slot}:
    put:
      operationId: uploadAttemptOutput
      parameters:
      - $ref: '#/components/parameters/AttemptId'
      - name: slot
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
      - name: X-WebX-Lease-Token
        in: header
        required: true
        schema:
          type: string
      - name: X-Content-SHA256
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/Sha256'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentEncoding: binary
      responses:
        '201':
          description: Staged output handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputHandle'
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - internal.worker
      x-webx-request-limits:
        max_body_bytes: 268435456
        max_response_bytes: 1048576
      x-webx-examples:
      - name: protocol-smoke
        summary: uploadAttemptOutput contract example
  /attempts/{attempt_id}/complete:
    post:
      operationId: completeAttempt
      parameters:
      - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptCompletion'
      responses:
        '200':
          description: Completion recorded or replayed idempotently
          content:
            application/json:
              schema:
                type: object
                required:
                - attempt_id
                - state
                - completion_hash
                properties:
                  attempt_id:
                    $ref: '#/components/schemas/Ulid'
                  state:
                    type: string
                    enum:
                    - completed
                    - partial
                    - cancelled
                  completion_hash:
                    $ref: '#/components/schemas/Sha256'
                additionalProperties: false
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - internal.worker
      x-webx-request-limits:
        max_body_bytes: 1048576
        max_response_bytes: 1048576
      x-webx-examples:
      - name: protocol-smoke
        summary: completeAttempt contract example
  /attempts/{attempt_id}/fail:
    post:
      operationId: failAttempt
      parameters:
      - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - lease_token
              - error
              properties:
                lease_token:
                  type: string
                error:
                  $ref: ./schemas/error.json
                uploaded_output_ids:
                  type: array
                  items:
                    $ref: '#/components/schemas/Ulid'
              additionalProperties: false
      responses:
        '200':
          description: Failure recorded or replayed idempotently
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - internal.worker
      x-webx-request-limits:
        max_body_bytes: 1048576
        max_response_bytes: 1048576
      x-webx-examples:
      - name: protocol-smoke
        summary: failAttempt contract example
  /egress/authorize:
    post:
      operationId: authorizeEgressDestination
      security:
      - egressServiceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EgressAuthorizationRequest'
      responses:
        '200':
          description: Effective connection authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EgressAuthorizationDecision'
        default:
          $ref: '#/components/responses/Problem'
      x-webx-scopes:
      - internal.egress
      x-webx-request-limits:
        max_body_bytes: 1048576
        max_response_bytes: 1048576
      x-webx-examples:
      - name: protocol-smoke
        summary: authorizeEgressDestination contract example
components:
  securitySchemes:
    bootstrapBearer:
      type: http
      scheme: bearer
    workerBearer:
      type: http
      scheme: bearer
    egressServiceBearer:
      type: http
      scheme: bearer
  parameters:
    WorkerId:
      name: worker_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    InputId:
      name: input_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
  schemas:
    Ulid:
      type: string
      pattern: ^[0-9a-hjkmnp-tv-z]{26}$
    Sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
    Capability:
      type: object
      required:
      - id
      - engine_id
      - engine_version
      - operations
      - resource_class
      - capacity
      properties:
        id:
          type: string
        engine_id:
          type: string
        engine_version:
          type: string
        build_digest:
          type: string
        operations:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
        resource_class:
          type: string
          enum:
          - tiny
          - cpu
          - browser
          - gpu
          - io
          - archive
        capacity:
          type: integer
          minimum: 1
        fixture_ids:
          type: array
          items:
            type: string
        extensions:
          type: object
          additionalProperties: true
      additionalProperties: false
    WorkerRegistration:
      type: object
      required:
      - protocol_versions
      - service_kind
      - instance_nonce
      - release
      - capabilities
      properties:
        protocol_versions:
          type: array
          items:
            type: string
            pattern: ^1\\.[0-9]+$
          minItems: 1
        service_kind:
          type: string
          enum:
          - egressd
          - browserd
          - pyfetchd
          - docd
          - mediad
          - archived
          - monitord
          - model-gateway
        instance_nonce:
          type: string
          minLength: 16
          maxLength: 128
        release:
          type: string
        config_digest:
          $ref: '#/components/schemas/Sha256'
        container_digest:
          type: string
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
          minItems: 1
      additionalProperties: false
    WorkerSession:
      type: object
      required:
      - worker_id
      - protocol_version
      - session_token
      - expires_at
      - heartbeat_seconds
      properties:
        worker_id:
          $ref: '#/components/schemas/Ulid'
        protocol_version:
          type: string
        session_token:
          type: string
          minLength: 32
        expires_at:
          type: string
          format: date-time
        heartbeat_seconds:
          type: integer
          minimum: 1
          maximum: 60
      additionalProperties: false
    InputHandle:
      type: object
      required:
      - input_id
      - kind
      - mime_type
      - size_bytes
      - sha256
      - download_url
      - expires_at
      properties:
        input_id:
          $ref: '#/components/schemas/Ulid'
        kind:
          type: string
          enum:
          - artifact
          - upload
          - inline_json
        artifact_id:
          $ref: '#/components/schemas/Ulid'
        mime_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        sha256:
          $ref: '#/components/schemas/Sha256'
        download_url:
          type: string
        expires_at:
          type: string
          format: date-time
      additionalProperties: false
    OutputSlot:
      type: object
      required:
      - name
      - required
      - max_bytes
      - allowed_mime_types
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        required:
          type: boolean
        max_bytes:
          type: integer
          minimum: 0
        allowed_mime_types:
          type: array
          items:
            type: string
          minItems: 1
      additionalProperties: false
    AttemptLease:
      type: object
      required:
      - protocol_version
      - job_id
      - attempt_id
      - attempt_number
      - lease_token
      - lease_expires_at
      - operation
      - capability_id
      - resource_class
      - policy_snapshot_hash
      - budgets
      - inputs
      - output_slots
      - cancellation_requested
      properties:
        protocol_version:
          type: string
        job_id:
          $ref: '#/components/schemas/Ulid'
        attempt_id:
          $ref: '#/components/schemas/Ulid'
        attempt_number:
          type: integer
          minimum: 1
        lease_token:
          type: string
          minLength: 32
        lease_expires_at:
          type: string
          format: date-time
        operation:
          type: string
        capability_id:
          type: string
        resource_class:
          type: string
        policy_snapshot_hash:
          $ref: '#/components/schemas/Sha256'
        request:
          type: object
          additionalProperties: true
        budgets:
          type: object
          additionalProperties:
            type: number
            minimum: 0
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/InputHandle'
        output_slots:
          type: array
          items:
            $ref: '#/components/schemas/OutputSlot'
        egress_session_token:
          type: string
        cancellation_requested:
          type: boolean
      additionalProperties: false
    OutputHandle:
      type: object
      required:
      - output_id
      - slot
      - mime_type
      - size_bytes
      - sha256
      properties:
        output_id:
          $ref: '#/components/schemas/Ulid'
        slot:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        sha256:
          $ref: '#/components/schemas/Sha256'
      additionalProperties: false
    AttemptCompletion:
      type: object
      required:
      - lease_token
      - completion_hash
      - state
      - observation
      - output_ids
      properties:
        lease_token:
          type: string
        completion_hash:
          $ref: '#/components/schemas/Sha256'
        state:
          type: string
          enum:
          - completed
          - partial
          - cancelled
        observation:
          $ref: ./schemas/engine-observation.json
        output_ids:
          type: array
          items:
            $ref: '#/components/schemas/Ulid'
          uniqueItems: true
        normalized_content_result:
          $ref: ./schemas/normalized-content-result.json
      additionalProperties: false
      description: Worker evidence only. webxd validates normalized content and decides final admission, visibility, identity,
        commit, indexing, and wiki work.
    EgressAuthorizationRequest:
      type: object
      required:
      - egress_session_token
      - scheme
      - host_ascii
      - port
      - resolved_addresses
      - protocol
      properties:
        egress_session_token:
          type: string
          minLength: 32
        scheme:
          type: string
          enum:
          - http
          - https
          - ws
          - wss
          - tcp
        host_ascii:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
        resolved_addresses:
          type: array
          items:
            type: string
            format: ip
          minItems: 1
          uniqueItems: true
        protocol:
          type: string
          enum:
          - http_proxy
          - connect
          - socks5h
        method:
          type: string
        request_bytes_planned:
          type: integer
          minimum: 0
      additionalProperties: false
    EgressAuthorizationDecision:
      type: object
      required:
      - decision
      - decision_id
      - expires_at
      properties:
        decision:
          type: string
          enum:
          - allow
          - deny
        decision_id:
          $ref: '#/components/schemas/Ulid'
        approved_addresses:
          type: array
          items:
            type: string
            format: ip
        max_connection_bytes:
          type: integer
          minimum: 0
        max_duration_ms:
          type: integer
          minimum: 0
        reason_code:
          type: string
        expires_at:
          type: string
          format: date-time
      additionalProperties: false
  responses:
    Problem:
      description: Problem details
      content:
        application/problem+json:
          schema:
            $ref: ./schemas/error.json
