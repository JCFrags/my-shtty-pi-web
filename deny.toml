[graph]
all-features = true

[licenses]
# Our own crates are publish = false and carry no license field.
private = { ignore = true }
# Deliberately minimal: extend this list consciously when a vetted dependency
# needs it (record the decision in DEPENDENCIES.md).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace are fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
