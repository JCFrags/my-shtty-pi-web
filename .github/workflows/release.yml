name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    env:
      # The runner checks out into a fresh directory each run; keeping the rust
      # build outside it means only changed crates recompile.
      CARGO_TARGET_DIR: ${{ runner.temp }}/../cargo-target
    steps:
      - uses: actions/checkout@v4

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: scripts/release.sh "main-$(git rev-parse --short HEAD)"

      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          scripts/publish-gist.sh | tee /tmp/publish.log
          grep -E '^(pinned|latest)=' /tmp/publish.log >> "$GITHUB_OUTPUT"

      - name: Installer
        run: |
          {
            echo "### pixel \`main-$(git rev-parse --short HEAD)\`"
            echo
            echo "This commit:"
            echo '```sh'
            echo "curl -fsSL ${{ steps.publish.outputs.pinned }} | bash"
            echo '```'
            echo "Always current main:"
            echo '```sh'
            echo "curl -fsSL ${{ steps.publish.outputs.latest }} | bash"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
