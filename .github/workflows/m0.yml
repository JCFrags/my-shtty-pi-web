name: WebX M0 gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  m0:
    name: Local-fixture M0 gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Validate workflow policy
        run: python3 scripts/ci_validate.py
      - name: Install the locked toolchain
        run: |
          npm install --global --prefix "$RUNNER_TEMP/node-toolchain" node@24.18.0
          export PATH="$RUNNER_TEMP/node-toolchain/bin:$PATH"
          npm install --global --prefix "$RUNNER_TEMP/pnpm-toolchain" pnpm@10.13.1
          pipx install --force uv==0.12.0
          export PATH="$RUNNER_TEMP/pnpm-toolchain/bin:$HOME/.local/bin:$PATH"
          uv python install 3.14.6
          python_bin="$(uv python find 3.14.6)"
          printf '%s\n' \
            "$RUNNER_TEMP/node-toolchain/bin" \
            "$RUNNER_TEMP/pnpm-toolchain/bin" \
            "$HOME/.local/bin" \
            "$(dirname "$python_bin")" >> "$GITHUB_PATH"
      - name: Populate locked dependency caches
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen --python 3.14.6
          uv run --no-project \
            --with 'jsonschema[format-nongpl]==4.25.1' \
            --with 'pyyaml==6.0.3' \
            --with 'referencing==0.36.2' \
            python -c 'pass'
      - name: Run M0 release preparation
        env:
          NO_COLOR: "1"
        run: make release-check
