name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - rebuild/terminal-browser-agent

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm -r build
      - name: Browser integration tests
        run: pnpm --filter terminal-browser test
      - name: CLI integration tests
        run: pnpm --filter terminal-browser-cli test
      - name: Store tests
        run: pnpm --filter pixel-store test
      - name: Pi extension tests
        run: pnpm --filter pi-terminal-browser test

  pixel-terminals-baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run upstream terminal-adapter baseline
        run: pnpm --filter pixel-terminals test
