name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack prepare pnpm@10.13.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Phase 1 browser protocol and runtime contracts
        run: pnpm test:browser-core
      - run: pnpm test

  browser-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/browser
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: components/browser/uv.lock
      - run: uv python install 3.13
      - run: uv sync --all-packages --locked
      - run: uv run pytest tests/reader tests/docling

  extraction-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: components/browser/uv.lock
      - run: corepack enable
      - run: corepack prepare pnpm@10.13.1 --activate
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: uv python install 3.13
        working-directory: components/browser
      - run: uv sync --all-packages --locked
        working-directory: components/browser
      - run: pnpm test:extraction

  browser-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/browser
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: components/browser
      - run: cargo check --workspace --all-targets --exclude pi-browser-workspace
      - run: cargo test --workspace --exclude pi-browser-workspace

  browser-fedora-workspace:
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - uses: actions/checkout@v4
      - name: Install Fedora build prerequisites
        run: >-
          dnf install -y
          gcc gcc-c++ make pkgconf-pkg-config curl git openssl-devel
          webkit2gtk4.1-devel libappindicator-gtk3-devel librsvg2-devel
          libxdo-devel gtk3-devel glib2-devel cairo-devel pango-devel
          gdk-pixbuf2-devel
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the browser workspace shell
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.88.0
          export PATH="$HOME/.cargo/bin:$PATH"
          npm install --global pnpm@10.13.1
          pnpm install --frozen-lockfile
          pnpm --filter @pi-web/workspace build
          cd components/browser
          cargo check -p pi-browser-workspace
