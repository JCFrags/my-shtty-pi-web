name: ci

on:
  push:
    branches:
      - rebuild/screenshot-first-browser
      - 'release/**'
      - 'releases/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  node-quality:
    name: Node lint, types, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack prepare pnpm@10.13.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:release-builder
      - run: pnpm test:browser-core
      - run: pnpm test

  protocol-schemas:
    name: Generated protocol schemas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack prepare pnpm@10.13.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @webx/browser-protocol schema:check
      - run: pnpm --filter @webx/workspace-protocol schema:check

  browser-python:
    name: Python reader, secure proxy, and extraction tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: components/browser
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: components/browser/uv.lock
      - run: uv python install 3.13
      - run: uv sync --all-packages --locked
      - name: Secure egress proxy
        run: uv run pytest tests/reader/test_secure_egress_proxy.py
      - name: Reader and document extraction
        run: uv run pytest tests/reader tests/docling benchmarks/extraction/tests
      - name: Deterministic extraction fixtures
        run: uv run python benchmarks/extraction/generate_fixtures.py --check

  extraction-contract:
    name: Deterministic extraction contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: components/browser/uv.lock
      - run: corepack enable
      - run: corepack prepare pnpm@10.13.1 --activate
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: uv python install 3.13
        working-directory: components/browser
      - run: uv sync --all-packages --locked
        working-directory: components/browser
      - run: pnpm test:extraction

  rust-and-tauri:
    name: Rust workspace and Tauri production checks
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Fedora build prerequisites
        run: >-
          dnf install -y
          gcc gcc-c++ make pkgconf-pkg-config curl git openssl-devel
          webkit2gtk4.1-devel libappindicator-gtk3-devel librsvg2-devel
          libxdo-devel gtk3-devel glib2-devel cairo-devel pango-devel
          gdk-pixbuf2-devel
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Rust and pnpm
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.88.0
          npm install --global pnpm@10.13.1
      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build bundled Tauri frontend assets
        run: pnpm --filter @pi-web/workspace build
      - name: Check every Rust target, including Tauri
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo check --workspace --all-targets --locked
        working-directory: components/browser
      - name: Test the complete Rust workspace
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --workspace --locked
        working-directory: components/browser

  release-reproducibility:
    name: Immutable Fedora release reproducibility
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 60
    steps:
      # Fedora's base container has no Git, so checkout would otherwise use a
      # source archive without the .git identity required by the release gate.
      - name: Install Git for identity-preserving checkout
        run: dnf install -y git
      - uses: actions/checkout@v4
      - name: Trust the container workspace checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Fedora release-build prerequisites
        run: >-
          dnf install -y
          gcc gcc-c++ make pkgconf-pkg-config tar rpm-build rustup
          openssl-devel webkit2gtk4.1-devel libappindicator-gtk3-devel
          librsvg2-devel libxdo-devel gtk3-devel glib2-devel cairo-devel
          pango-devel gdk-pixbuf2-devel
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Rust and pnpm
        run: |
          rustup-init -y --no-modify-path --profile minimal --default-toolchain 1.88.0
          npm install --global pnpm@10.13.1
      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and compare two immutable Fedora releases
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          pnpm release:reproducibility \
            --work-root "$RUNNER_TEMP/pi-web-release-repro-$GITHUB_SHA" \
            --expected-sha "$GITHUB_SHA" \
            --tested-browser not-tested-in-ci

  installer-profiles:
    name: Installer and profile validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/install-contract.test.mjs scripts/m9-profile-contract.test.mjs

  supply-chain:
    name: Dependency licenses and vendored sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack prepare pnpm@10.13.1 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:supply-chain
